<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap');
:root{--am:#F5C800;--bg:#0B1120;--mid:#152040;--deep:#1E3A6E;--fg:#F7F8FA;--mute:#8A97AE;--red:#E8253A;--grn:#00C48C;--pink:#FF6B9D}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}

/* ── HEADER ── */
header{background:var(--bg);border-bottom:2px solid var(--am);padding:0 16px;position:sticky;top:0;z-index:100}
.hi{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{text-decoration:none;display:flex;align-items:center;gap:10px}
.logo-icon{font-size:28px}
.logo-txt .name{font-weight:800;font-size:22px;letter-spacing:-0.5px;color:var(--fg)}
.logo-txt .name span{color:var(--am)}
.logo-txt .tag{font-size:9px;color:var(--mute);letter-spacing:1.5px;text-transform:uppercase}
.hright{display:flex;align-items:center;gap:10px}
.ldot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.btnact{background:var(--am);color:var(--bg);border:none;border-radius:6px;padding:7px 14px;font-family:'Sora',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.btnact:hover{opacity:.85}.btnact:disabled{opacity:.4;cursor:not-allowed}

/* ── BANNER AD SLOT ── */
.ad-banner{max-width:960px;margin:0 auto;padding:8px 16px;text-align:center}
.ad-banner ins{display:block}
.ad-label{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}

/* ── CITY BAR ── */
.citybar{background:var(--mid);border-bottom:1px solid rgba(255,255,255,.06);padding:0 16px;overflow-x:auto;scrollbar-width:none}
.citybar::-webkit-scrollbar{display:none}
.cbi{max-width:960px;margin:0 auto;display:flex;gap:4px;padding:10px 0}
.cb{background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 13px;color:var(--mute);font-family:'Sora',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.cb:hover{border-color:var(--am);color:var(--am)}.cb.on{background:var(--am);border-color:var(--am);color:var(--bg)}

/* ── CATEGORY BAR ── */
.catbar{background:var(--bg);padding:0 16px;border-bottom:1px solid rgba(255,255,255,.06);overflow-x:auto;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.cati{max-width:960px;margin:0 auto;display:flex}
.catb{background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 13px;color:var(--mute);font-family:'Sora',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.catb:hover{color:var(--fg)}.catb.on{color:var(--am);border-bottom-color:var(--am)}
.catb.fan.on{color:var(--pink);border-bottom-color:var(--pink)}

/* ── MAIN ── */
.main{max-width:960px;margin:0 auto;padding:18px 16px}
.srchwrap{position:relative;margin-bottom:14px}
.srchinp{width:100%;background:var(--mid);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 16px 11px 42px;color:var(--fg);font-family:'Sora',sans-serif;font-size:14px;outline:none;transition:border-color .15s}
.srchinp:focus{border-color:var(--am)}.srchinp::placeholder{color:var(--mute)}
.srchico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}

/* ── STATUS BAR ── */
.statusbar{background:var(--mid);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stchip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;display:flex;align-items:center;gap:5px}
.stchip.ok{background:rgba(0,196,140,.15);color:var(--grn);border:1px solid rgba(0,196,140,.3)}
.stchip.load{background:rgba(245,200,0,.1);color:var(--am);border:1px solid rgba(245,200,0,.2);animation:blink .9s infinite alternate}
.stchip.err{background:rgba(232,37,58,.1);color:#e87a8a;border:1px solid rgba(232,37,58,.2)}
@keyframes blink{from{opacity:1}to{opacity:.5}}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── NEWS CARDS ── */
.statrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.stattxt{font-size:12px;color:var(--mute)}.stattxt strong{color:var(--grn)}
.seclbl{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.fcard{background:var(--mid);border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid rgba(255,255,255,.07);text-decoration:none;display:block;transition:transform .15s,border-color .15s}
.fcard:hover{transform:translateY(-2px);border-color:var(--am)}
.fcard.fan-card:hover{border-color:var(--pink)}
.fthumb{width:100%;height:190px;background:linear-gradient(135deg,var(--deep),var(--mid));display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden}
.fthumb img{width:100%;height:100%;object-fit:cover}
.fbody{padding:16px}
.fmeta{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.bdg{background:var(--am);color:var(--bg);font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
.bdg.fan{background:var(--pink);color:#fff}
.bdg.yt{background:#FF0000;color:#fff}
.tago{font-size:11px;color:var(--mute)}.clbl{font-size:11px;color:var(--grn);font-weight:600}
.ftitle{font-family:'Newsreader',serif;font-size:19px;font-weight:700;line-height:1.3;color:var(--fg);margin-bottom:6px}
.fsum{font-size:13px;color:var(--mute);line-height:1.6}
.ngrid{display:flex;flex-direction:column;gap:8px}
.ncard{background:var(--mid);border-radius:12px;padding:13px;border:1px solid rgba(255,255,255,.06);text-decoration:none;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,transform .1s}
.ncard:hover{border-color:rgba(245,200,0,.35);transform:translateX(2px)}
.ncard.fan-card:hover{border-color:rgba(255,107,157,.4)}
.nthumb{width:66px;height:66px;border-radius:8px;background:var(--deep);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.nthumb img{width:100%;height:100%;object-fit:cover}
.nbody{flex:1;min-width:0}
.nmeta{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.ntitle{font-family:'Newsreader',serif;font-size:15px;font-weight:500;line-height:1.35;color:var(--fg);margin-bottom:3px}
.nsrc{font-size:11px;color:var(--mute)}

/* ── AD BETWEEN ARTICLES ── */
.ad-inline{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px;text-align:center;margin:12px 0}

/* ── PAGINATION ── */
.pag{display:flex;justify-content:center;gap:8px;margin-top:24px}
.pagbtn{background:var(--mid);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 20px;color:var(--fg);font-family:'Sora',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.pagbtn:hover{border-color:var(--am);color:var(--am)}.pagbtn:disabled{opacity:.3;cursor:not-allowed}

/* ── LOADER ── */
.spinner{width:34px;height:34px;border:3px solid rgba(245,200,0,.15);border-top-color:var(--am);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 20px}
.loadtxt{color:var(--mute);font-size:13px}
.empty{text-align:center;padding:60px 20px;color:var(--mute)}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--am);color:var(--bg);font-weight:700;font-size:13px;padding:10px 20px;border-radius:8px;transition:transform .3s;z-index:999;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid rgba(255,255,255,.06);padding:20px;text-align:center;color:var(--mute);font-size:12px;max-width:960px;margin:0 auto}
@media(max-width:600px){.logo-txt .tag{display:none}.ftitle{font-size:17px}.nthumb{width:58px;height:58px}}

/* ── PATROCINADOR ── */
.sponsor{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(245,200,0,.10),rgba(30,58,110,.35));border:1px solid rgba(245,200,0,.35);border-radius:12px;padding:12px 14px;margin-bottom:14px;text-decoration:none;color:var(--fg)}
.sponsor img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0}
.sponsor .sp-ico{width:48px;height:48px;border-radius:8px;background:var(--deep);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.sponsor .sp-body{flex:1;min-width:0}
.sponsor .sp-tag{font-size:9px;font-weight:700;color:var(--am);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:2px}
.sponsor .sp-name{font-size:14px;font-weight:700;line-height:1.25}
.sponsor .sp-txt{font-size:12px;color:var(--mute);line-height:1.4;margin-top:2px}
.sponsor .sp-cta{font-size:11px;font-weight:700;color:var(--bg);background:var(--am);border-radius:6px;padding:6px 10px;white-space:nowrap}
.sponsor.empty-slot{border-style:dashed}
/* ── COMPARTIR / INSTALAR ── */
.btnico{background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 10px;font-family:'Sora',sans-serif;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btnico:hover{border-color:var(--am);color:var(--am)}
.shbtn{background:transparent;border:none;color:var(--mute);font-family:'Sora',sans-serif;font-size:11px;font-weight:600;cursor:pointer;padding:2px 6px;margin-left:6px;border-radius:4px}
.shbtn:hover{color:var(--am);background:rgba(245,200,0,.08)}
.fbody .shbtn{margin:10px 0 0;padding:4px 0;font-size:12px}
@media(max-width:600px){.btnico .lbl{display:none}}
.btnico.on{background:var(--am);color:#0B1120}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.f{fill:currentColor}.i.big{width:38px;height:38px;opacity:.7}
.nthumb .i,.fthumb>.i{width:30px;height:30px;opacity:.75}
.logo-icon .i{width:26px;height:26px;color:var(--am)}
.srchico .i{width:18px;height:18px}
.cb .i,.catb .i{margin-right:4px}
.shbtn.on{color:var(--am)}
.nsrc{flex-wrap:wrap}
.statrow .shbtn{border:1px solid rgba(255,255,255,.15);padding:4px 10px;margin:0}
@media(max-width:600px){.ncard .lb{display:none}}
</style>
</head>

<div class="main">
  <div id="sponsorSlot"></div>
  <div class="srchwrap">
    <span class="srchico"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg></span>

</div>

<footer>
  EcuaNews · Noticias de Ecuador en tiempo real<br>
  <span style="color:rgba(255,255,255,.2);font-size:11px;">El contenido pertenece a sus respectivos medios. EcuaNews solo agrega y redirige.</span>
</footer>
<div class="toast" id="toast"></div>

<script>
const API='https://ecual-backend.onrender.com/api';
const PAGE_SIZE=30;
const CAT_ICO={seguridad:'shield',politica:'landmark',economia:'dollar',transito:'car',salud:'health',deportes:'ball',tecnologia:'laptop',farandula:'star',general:'news'};
function I(n,fill,cls){return `<svg class="i${fill?' f':''}${cls?' '+cls:''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;}
function catIco(c){return I(CAT_ICO[c]||'news');}
function imgFail(img,c){const p=img.parentElement;if(p)p.innerHTML=catIco(c);}
function cl(t){return String(t||'').replace(/^\u{1F4FA}\s*/u,'');}
let ciudad='todas',cat='todas',pagina=0,totalNews=0,searchTimer=null,CUR=[];

function timeAgo(iso){
  const m=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return'ahora mismo';if(m<60)return`hace ${m} min`;
  const h=Math.floor(m/60);if(h<24)return`hace ${h} h`;
  return`hace ${Math.floor(h/24)} d`;
}

function getBadge(n){
  if(n.categoria==='farandula')return'bdg fan';
  if(n.tipo==='youtube')return'bdg yt';
  return'bdg';
}
function getFanClass(n){return n.categoria==='farandula'?' fan-card':'';}
function getPrefix(n){return n.tipo==='youtube'?I('play',true)+' ':'';}

async function fetchNews(loader=true){
  if(VIEW==='saved'){renderSaved();return;}
  const q=document.getElementById('q').value.trim();
  if(loader)setContainer(`<div class="loadwrap"><div class="spinner"></div><div class="loadtxt">Cargando noticias…</div></div>`);
  try{
    const params=new URLSearchParams({limit:PAGE_SIZE,offset:pagina*PAGE_SIZE});
    if(ciudad!=='todas')params.set('ciudad',ciudad);
    if(cat!=='todas')params.set('categoria',cat);
    if(q)params.set('q',q);
    const res=await fetch(`${API}/noticias?${params}`);
    if(!res.ok)throw new Error(`Error ${res.status}`);
    const data=await res.json();
    totalNews=data.total||data.noticias?.length||0;
    renderNews(data.noticias||[]);
    renderPag();
    updateStatus(true,data.noticias?.length||0);
  }catch(e){
    updateStatus(false);
    setContainer(`<div class="empty"><div style="margin-bottom:12px">${I('alert',false,'big')}</div><p style="color:var(--mute)">${e.message}</p></div>`);
  }
}

function renderNews(noticias){
  if(!noticias.length){
    setContainer(`<div class="empty"><div style="margin-bottom:12px">${I('search',false,'big')}</div><p style="color:var(--mute)">No hay noticias para este filtro.</p></div>`);
    return;
  }
  const[top,...rest]=noticias;CUR=noticias;
  const th=top.img_url?`<img src="${top.img_url}" alt="" loading="lazy" onerror="imgFail(this,'${top.categoria}')">`:catIco(top.categoria);

  let html=`
    <div class="statrow">
      <span class="stattxt">${VIEW==='saved'?`<strong>${noticias.length}</strong> noticias guardadas`:`Mostrando <strong>${noticias.length}</strong> de ${totalNews} noticias`}</span>${canTTS?`<button class="shbtn" id="btnHeads" onclick="speakHeadlines()">${I('headphones')} Escuchar titulares</button>`:''}
      <span class="stattxt">${new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})}</span>
    </div>
    <div class="seclbl">${I(cat==='farandula'?'star':'pin')} Más reciente</div>
    <a class="fcard${getFanClass(top)}" href="${top.url}" target="_blank" rel="noopener">
      <div class="fthumb">${th}</div>
      <div class="fbody">
        <div class="fmeta">
          <span class="${getBadge(top)}">${getPrefix(top)}${top.fuente_nombre||''}</span>
          <span class="clbl">${I('pin')} ${top.ciudad_label||'Nacional'}</span>
          <span class="tago">${timeAgo(top.publicado_en)}</span>
        </div>
        <div class="ftitle">${cl(top.titulo)}</div>
        ${top.resumen?`<div class="fsum">${top.resumen.slice(0,220)}…</div>`:''}
        ${acts(0,top)}
      </div>
    </a>`;

  if(rest.length){
    html+=`<div class="seclbl" style="margin-top:18px">${I('news')} Noticias</div><div class="ngrid">`;
    rest.forEach((n,i)=>{
      const t2=n.img_url?`<img src="${n.img_url}" alt="" loading="lazy" onerror="imgFail(this,'${n.categoria}')">`:catIco(n.categoria);
      html+=`<a class="ncard${getFanClass(n)}" href="${n.url}" target="_blank" rel="noopener">
        <div class="nthumb">${t2}</div>
        <div class="nbody">
          <div class="nmeta"><span class="${getBadge(n)}">${getPrefix(n)}${n.fuente_nombre||''}</span><span class="clbl">${I('pin')} ${n.ciudad_label||'Nacional'}</span></div>
          <div class="ntitle">${cl(n.titulo)}</div>
          <div class="nsrc">${timeAgo(n.publicado_en)}${acts(i+1,n)}</div>
        </div>
      </a>`;
      /* AD cada 10 noticias — descomenta cuando tengas AdSense aprobado
      if((i+1)%10===0){
        html+=`<div class="ad-inline">
          <div class="ad-label">Publicidad</div>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
          <script>(adsbygoogle=window.adsbygoogle||[]).push({});<\/script>
        </div>`;
      }*/
    });
    html+=`</div>`;
  }
  setContainer(html);
}

function renderPag(){
  const pag=document.getElementById('pag');
  const total=Math.ceil(totalNews/PAGE_SIZE);
  if(total<=1){pag.innerHTML='';return;}
  pag.innerHTML=`<button class="pagbtn" onclick="goPage(${pagina-1})" ${pagina===0?'disabled':''}>← Anterior</button>
    <span style="color:var(--mute);font-size:13px;padding:0 8px;align-self:center">${pagina+1} / ${total}</span>
    <button class="pagbtn" onclick="goPage(${pagina+1})" ${pagina>=total-1?'disabled':''}>Siguiente →</button>`;
}

function updateStatus(ok,count){
  const bar=document.getElementById('statusbar');
  if(!ok){bar.innerHTML=`<span class="stchip err"><span class="sdot"></span>Error de conexión</span>`;return;}
  if(!count){bar.innerHTML=`<span class="stchip load"><span class="sdot"></span>Cargando desde los medios…</span>`;return;}
  bar.innerHTML=`<span class="stchip ok"><span class="sdot"></span>${totalNews} noticias · Actualiza cada 15 min</span>`;
}

function goPage(p){pagina=p;window.scrollTo({top:0,behavior:'smooth'});fetchNews();}
function setCity(c,btn){leaveSaved();ciudad=c;pagina=0;renderSponsor();document.querySelectorAll('.cb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');fetchNews();}
function setCat(c,btn){leaveSaved();cat=c;pagina=0;document.querySelectorAll('.catb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');fetchNews();}
function debounceSearch(){leaveSaved();clearTimeout(searchTimer);searchTimer=setTimeout(()=>{pagina=0;fetchNews(false);},400);}
function reload(){const b=document.getElementById('btnRef');b.disabled=true;b.textContent='Actualizando…';fetchNews().then(()=>{b.disabled=false;b.innerHTML=I('refresh')+' Actualizar';showToast('Actualizado');});}
function setContainer(h){document.getElementById('container').innerHTML=h;}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

/* ═════════ PATROCINADORES POR CIUDAD ═════════
   Para vender un espacio: descomenta/edita la ciudad correspondiente.
   - nombre, texto, url (a donde lleva el clic), img (logo opcional, URL https)
   Ciudad sin patrocinador muestra "Anuncia aquí" (invitación a anunciar). */
const CONTACT_WA='593000000000'; // ← CAMBIAR por tu WhatsApp (593 + número sin 0)
const APP_URL='https://rdm-tv.github.io/EcuaNews/';
const SPONSORS={
  // manta:{nombre:'Nombre del negocio',texto:'Promoción o eslogan corto',url:'https://wa.me/593999999999',img:''},
  // guayaquil:{nombre:'',texto:'',url:'',img:''},
};
const CITY_NAMES={todas:'todo Ecuador',quito:'Quito',guayaquil:'Guayaquil',manta:'Manta',portoviejo:'Portoviejo','santo domingo':'Santo Domingo',cuenca:'Cuenca',ambato:'Ambato',loja:'Loja',esmeraldas:'Esmeraldas',machala:'Machala',ibarra:'Ibarra'};
function esc(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderSponsor(){
  const el=document.getElementById('sponsorSlot');
  const sp=SPONSORS[ciudad];
  if(sp&&sp.nombre){
    const ico=sp.img?`<img src="${esc(sp.img)}" alt="">`:`<div class="sp-ico">${I('mega')}</div>`;
    el.innerHTML=`<a class="sponsor" href="${esc(sp.url)}" target="_blank" rel="sponsored noopener">${ico}<div class="sp-body"><div class="sp-tag">Patrocinado</div><div class="sp-name">${esc(sp.nombre)}</div><div class="sp-txt">${esc(sp.texto)}</div></div><span class="sp-cta">Ver</span></a>`;
  }else{
    const nombre=CITY_NAMES[ciudad]||'tu ciudad';
    const msg=encodeURIComponent(`Hola, quiero anunciar mi negocio en EcuaNews (${nombre}). ¿Qué precio tiene?`);
    el.innerHTML=`<a class="sponsor empty-slot" href="https://wa.me/${CONTACT_WA}?text=${msg}" target="_blank" rel="noopener"><div class="sp-ico">${I('mega')}</div><div class="sp-body"><div class="sp-tag">Espacio publicitario</div><div class="sp-name">Anuncia tu negocio en ${esc(nombre)}</div><div class="sp-txt">Llega a lectores de tu ciudad todos los días.</div></div><span class="sp-cta">Anunciar</span></a>`;
  }
}

/* ═════════ COMPARTIR ═════════ */
function shareApp(){
  const data={title:'EcuaNews',text:'EcuaNews: las noticias de todo Ecuador en un solo lugar',url:APP_URL};
  if(navigator.share){navigator.share(data).catch(()=>{});}
  else{window.open('https://wa.me/?text='+encodeURIComponent(data.text+' '+APP_URL),'_blank');}
}
function shareNews(ev,i){
  ev.preventDefault();ev.stopPropagation();
  const n=CUR[i];if(!n)return;
  const titulo=cl(n.titulo);
  if(navigator.share){navigator.share({title:titulo,text:titulo+' — vía EcuaNews '+APP_URL,url:n.url}).catch(()=>{});}
  else{window.open('https://wa.me/?text='+encodeURIComponent(titulo+'\n'+n.url+'\n\nVía EcuaNews '+APP_URL),'_blank');}
}

/* ═════════ INSTALAR (PWA) ═════════ */
let deferredPrompt=null;
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  if(!isStandalone)document.getElementById('btnInstall').style.display='inline-flex';
});
window.addEventListener('appinstalled',()=>{document.getElementById('btnInstall').style.display='none';showToast('EcuaNews instalada');});
if(isIOS&&!isStandalone)document.getElementById('btnInstall').style.display='inline-flex';
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;document.getElementById('btnInstall').style.display='none';});
  }else if(isIOS){
    alert('Para instalar en iPhone: toca el botón Compartir de Safari y elige "Añadir a pantalla de inicio".');
  }else{
    alert('Abre el menú del navegador (⋮) y elige "Instalar app" o "Añadir a pantalla de inicio".');
  }
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}

window.addEventListener('offline',()=>showToast('Sin conexión: verás las últimas noticias guardadas'));
window.addEventListener('online',()=>{showToast('Conexión recuperada');fetchNews(false);});

/* ═════════ ALERTAS DE ÚLTIMA HORA (push) ═════════ */
function b64ToU8(b){const p='='.repeat((4-b.length%4)%4),r=(b+p).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(r);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function pushSub(){const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription();}
async function refreshBell(){
  const b=document.getElementById('btnBell');if(!b)return;
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){if(!isIOS)b.style.display='none';return;}
  try{const s=await pushSub();b.classList.toggle('on',!!s);b.title=s?'Alertas activadas (toca para desactivar)':'Activar alertas de última hora';}catch(e){}
}
async function toggleAlertas(){
  if(isIOS&&!isStandalone){alert('En iPhone las alertas solo funcionan con la app instalada: toca Compartir en Safari → "Añadir a pantalla de inicio", ábrela y activa la campana (Alertas) desde ahí.');return;}
  if(!('PushManager' in window)){alert('Tu navegador no admite notificaciones.');return;}
  try{
    const reg=await navigator.serviceWorker.ready,cur=await reg.pushManager.getSubscription();
    if(cur){
      if(!confirm('¿Desactivar las alertas de última hora?'))return;
      await fetch(`${API}/push/unsubscribe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:cur.endpoint})}).catch(()=>{});
      await cur.unsubscribe();showToast('Alertas desactivadas');refreshBell();return;
    }
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){showToast('Permiso de notificaciones denegado');return;}
    const k=await (await fetch(`${API}/push/key`)).json();
    if(!k.activo){showToast('Las alertas aún no están habilitadas en el servidor');return;}
    let ciudades=[];
    if(ciudad!=='todas'&&confirm('¿Recibir solo alertas de esta ciudad?\n\nAceptar = solo esta ciudad (y las nacionales)\nCancelar = todo Ecuador'))ciudades=[ciudad];
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(k.publicKey)});
    const r=await fetch(`${API}/push/subscribe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),ciudades})});
    if(!(await r.json()).ok)throw new Error('No se pudo guardar');
    fetch(`${API}/push/test`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});
    showToast('Alertas activadas');refreshBell();
  }catch(e){showToast('No se pudo activar: '+e.message);}
}
window.addEventListener('load',()=>setTimeout(refreshBell,800));

/* ═════════ GUARDADAS · AUDIO ═════════ */
let VIEW='feed';
const FAV_KEY='ecua_fav_v1';
const canTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY)||'[]');}catch(e){return [];}}
function setFavs(a){try{localStorage.setItem(FAV_KEY,JSON.stringify(a.slice(0,100)));}catch(e){showToast('No se pudo guardar');}}
function isFav(id){return getFavs().some(f=>f.id===id);}
function acts(i,n){
  const f=isFav(n.id);
  return `<button class="shbtn${f?' on':''}" onclick="toggleFav(event,${i})" aria-label="${f?'Quitar de guardadas':'Guardar noticia'}">${I('bookmark',f)}<span class="lb"> ${f?'Guardada':'Guardar'}</span></button>`
   +(canTTS?`<button class="shbtn" onclick="speakNews(event,${i})" aria-label="Escuchar noticia">${I('headphones')}<span class="lb"> Escuchar</span></button>`:'')
   +`<button class="shbtn" onclick="shareNews(event,${i})" aria-label="Compartir noticia">${I('share')}<span class="lb"> Compartir</span></button>`;
}
function toggleFav(ev,i){
  ev.preventDefault();ev.stopPropagation();
  const n=CUR[i];if(!n)return;
  let favs=getFavs();
  if(favs.some(f=>f.id===n.id)){favs=favs.filter(f=>f.id!==n.id);setFavs(favs);showToast('Quitada de guardadas');}
  else{favs.unshift({id:n.id,titulo:n.titulo,resumen:n.resumen,url:n.url,fuente_nombre:n.fuente_nombre,tipo:n.tipo,ciudad_label:n.ciudad_label,categoria:n.categoria,img_url:n.img_url,publicado_en:n.publicado_en});setFavs(favs);showToast('Guardada para leer después');}
  if(VIEW==='saved')renderSaved();else{const b=ev.currentTarget,f=isFav(n.id);b.classList.toggle('on',f);b.innerHTML=I('bookmark',f)+'<span class="lb"> '+(f?'Guardada':'Guardar')+'</span>';}
}
function renderSaved(){
  const favs=getFavs();stopSpeak();
  document.getElementById('pag').innerHTML='';
  if(!favs.length){CUR=[];setContainer(`<div class="empty"><div style="margin-bottom:12px">${I('bookmark',false,'big')}</div><p style="color:var(--mute)">Aún no guardaste noticias.<br>Toca "Guardar" en cualquier noticia y la verás aquí, incluso sin internet.</p></div>`);return;}
  renderNews(favs);
}
function toggleSaved(){
  VIEW=VIEW==='saved'?'feed':'saved';
  document.getElementById('btnFav').classList.toggle('on',VIEW==='saved');
  if(VIEW==='saved')renderSaved();else fetchNews();
}
function leaveSaved(){if(VIEW==='saved'){VIEW='feed';document.getElementById('btnFav').classList.remove('on');}}
/* audio (voz del navegador, gratis) */
let speaking=false;
function vozES(){const v=speechSynthesis.getVoices();return v.find(x=>/^es[-_](EC|MX|US|419)/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null;}
function stopSpeak(){if(!canTTS)return;speaking=false;try{speechSynthesis.cancel();}catch(e){}const b=document.getElementById('btnHeads');if(b)b.innerHTML=I('headphones')+' Escuchar titulares';}
function speakList(texts){
  stopSpeak();if(!texts.length)return;speaking=true;
  const b=document.getElementById('btnHeads');if(b)b.innerHTML=I('stop',true)+' Detener';
  const v=vozES();
  texts.forEach((t,k)=>{
    const u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:'es-ES';if(v)u.voice=v;u.rate=1;
    if(k===texts.length-1)u.onend=()=>stopSpeak();
    u.onerror=()=>{if(speaking)stopSpeak();};
    speechSynthesis.speak(u);
  });
}
function speakNews(ev,i){
  ev.preventDefault();ev.stopPropagation();
  const n=CUR[i];if(!n)return;
  if(speaking){stopSpeak();return;}
  const sum=String(n.resumen||'').replace(/\s+/g,' ').slice(0,260);
  speakList([cl(n.titulo)+'. '+(n.fuente_nombre?'Fuente: '+n.fuente_nombre+'.':''),sum].filter(Boolean));
}
function speakHeadlines(){
  if(speaking){stopSpeak();return;}
  speakList(CUR.slice(0,5).map((n,k)=>'Noticia '+(k+1)+'. '+cl(n.titulo)));
}
if(canTTS)speechSynthesis.onvoiceschanged=()=>{};

renderSponsor();
setInterval(()=>fetchNews(false),10*60*1000);
fetchNews();
</script>
</body>
